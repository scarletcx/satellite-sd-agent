[project]
name = "satellite-sd-agent"
version = "0.1.0"
description = "AI 卫星总体设计助手（骨架阶段）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.36",
  "docxtpl>=0.17",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "mammoth>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
